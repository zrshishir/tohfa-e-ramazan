name: Laravel Test

# The previous workflow ran only on push, so no pull request was ever tested. It also
# spun up Docker Compose and MySQL, which the suite no longer needs: phpunit.xml runs
# against in-memory SQLite. Every run of it failed.
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.2 only: the committed composer.lock pins laminas/laminas-diactoros,
        # nette/schema, nette/utils and league/config to versions that declare
        # `php <8.3`, so `composer install` cannot resolve on 8.3. Widening the
        # matrix needs a `composer update` first — tracked separately.
        php: ['8.2']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # pdo_sqlite backs the in-memory test database; intl and mbstring are needed
          # for the Arabic and Bangla content.
          extensions: mbstring, intl, pdo_sqlite, sqlite3, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  lint:
    name: Syntax check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      # Cheap guard against a parse error reaching development.
      - name: php -l over app, database, routes and tests
        run: |
          find app database routes tests -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null
